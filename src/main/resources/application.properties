# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# validate: Hibernate checks entity ↔ schema consistency but never mutates DDL.
# Flyway owns schema changes from now on.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ============================================================
# ENCODING
# ============================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# ============================================================
# EMAIL (Resend REST API)
# Required env vars: RESEND_API_KEY, MAIL_FROM, MAIL_RECEIVER
# ============================================================
resend.api-key=${RESEND_API_KEY:}
email.from=${MAIL_FROM:}
email.nhan=${MAIL_RECEIVER:}

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:8080}
server.forward-headers-strategy=NATIVE

# ============================================================
# ADMIN IP WHITELIST
# Override via Railway env var ADMIN_ALLOWED_IP.
# Separate multiple IPs with commas: 1.2.3.4,5.6.7.8
# ============================================================

# ============================================================
# SPRING ACTUATOR
# Expose only /health for uptime monitoring (Railway, UptimeRobot, etc.)
# Never expose /env or /beans in production.
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.server.port=${PORT:8080}

# ============================================================
# CACHE (Caffeine)
# Products list cached for 10 minutes; evicted on any save/delete.
# ============================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ============================================================
# LOGGING — stdout only (container-friendly, no local file rotation)
# On Railway/Render logs are streamed to the platform log aggregator.
# ============================================================
logging.level.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] %msg%n

spring.web.resources.static-locations=classpath:/static/

# ============================================================
# COMPRESSION
# ============================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# ============================================================
# STATIC RESOURCE CACHING (CSS, images, JS — 30-day max-age)
# ============================================================
spring.web.resources.cache.cachecontrol.max-age=2592000
spring.web.resources.cache.cachecontrol.cache-public=true
