# Database - Dùng biến môi trường từ Railway
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tăng timeout cho kết nối
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5 

# ===== JPA =====
# update: adds missing columns/tables on startup; never drops existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Encoding =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== File Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# ===== Email (Resend REST API) =====
# Railway env vars needed:
#   RESEND_API_KEY = your Resend API key (starts with re_...)
#   MAIL_FROM      = verified sender address, e.g. noreply@omeax.com
#   MAIL_RECEIVER  = inbox that receives notifications, e.g. info@omeax.com
resend.api-key=${RESEND_API_KEY:}
email.from=${MAIL_FROM:}
email.nhan=${MAIL_RECEIVER:}

# ===== Server =====
server.port=${PORT:8080}

# Let the servlet container (Tomcat) process X-Forwarded-For / X-Forwarded-Proto
# headers set by the trusted upstream proxy (Railway, nginx, etc.).
# With NATIVE, Tomcat's RemoteIpValve rewrites request.getRemoteAddr() to the
# real client IP. Application code must call request.getRemoteAddr() directly —
# never parse X-Forwarded-For manually, which is trivially spoofable.
server.forward-headers-strategy=NATIVE

# ============================================
# LOGGING CONFIGURATION
# ============================================

# Mức log cho package của bạn (DEBUG để thấy chi tiết khi dev)
logging.level.demo=INFO

# Mức log cho Spring (INFO là đủ)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Tắt log SQL của Hibernate (bật DEBUG nếu cần debug SQL)
logging.level.org.hibernate=ERROR

# Định dạng log trên console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %msg%n

# Ghi log ra file
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

spring.web.resources.static-locations=classpath:/static/