<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Van & Bơm Nước Quy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Dấu sao đỏ sau nhãn để khách biết đây là mục cần điền */
        .required-label::after {
            content: " *";
            color: #dc3545;
            font-weight: bold;
        }

        /* Khi mới bật lên: Các ô bắt buộc có viền xám bình thường */
        .form-control {
            border: 1px solid #dee2e6;
        }

        /* CHỈ khi nhấn nút Gửi (was-validated), ô nào thiếu mới bôi đỏ */
        .was-validated .form-control:invalid {
            border-color: #dc3545 !important;
            background-image: none !important; /* Tắt icon X của Bootstrap */
        }

        /* Ô điền đúng thì giữ nguyên viền xám, không hiện màu xanh */
        .was-validated .form-control:valid {
            border-color: #dee2e6 !important;
            background-image: none !important; /* Tắt icon tích xanh của Bootstrap */
            box-shadow: none !important;
        }

        .invalid-feedback {
            color: #dc3545;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">Van & Bơm Nước Quy</span>
    <div>
        <a href="/" class="text-white me-2">Trang chủ</a>
        <a href="/san-pham" class="text-white me-2">Sản phẩm</a>
        <a href="/lien-he" class="text-white">Liên hệ</a>
    </div>
</nav>

<div class="container mt-4 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h4 class="mb-4">Yêu cầu báo giá</h4>

            <div th:if="${thanhCong}" class="alert alert-success">
                Cảm ơn bạn! Chúng tôi sẽ liên hệ sớm nhất có thể.
            </div>
            <div th:if="${errors}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="error : ${errors}" th:text="${error.defaultMessage}"></li>
                </ul>
            </div>
            <form action="/lien-he" method="post" class="needs-validation" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label required-label">Họ tên</label>
                    <input type="text" name="hoTen" class="form-control" placeholder="Nhập họ và tên" required>
                    <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">Số điện thoại</label>
                    <input type="tel" name="soDienThoai" class="form-control" placeholder="Nhập số điện thoại" required>
                    <div class="invalid-feedback">Vui lòng nhập số điện thoại.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@vi-du.com" required>
                    <div class="invalid-feedback">Vui lòng nhập địa chỉ email.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">Sản phẩm quan tâm</label>
                    <input type="text" name="sanPhamQuanTam" class="form-control" placeholder="Ví dụ: Van cổng DN50, Bơm ly tâm..." required>
                    <div class="invalid-feedback">Vui lòng nhập tên sản phẩm.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nội dung yêu cầu (Ghi chú)</label>
                    <textarea name="noiDung" class="form-control" rows="4" placeholder="Ghi chú thêm về số lượng, địa điểm... (không bắt buộc)"></textarea>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">GỬI YÊU CẦU</button>
            </form>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <small>© 2026 Van & Bơm Nước Quy. All rights reserved.</small>
</footer>

<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
