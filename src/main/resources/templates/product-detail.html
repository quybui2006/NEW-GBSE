<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/layout :: head('Product Details | OMEAX')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main id="main">

<section class="crumb">
  <div class="container">
    <a href="/">Home</a><span class="sep">/</span>
    <a href="/products">Products</a><span class="sep">/</span>
    <span class="crumb-current" th:text="${product.name}">Product</span>
  </div>
</section>

<section class="section-pad-3">
  <div class="container">
    <div class="detail-hero">
      <div class="img-box"><img th:src="${product.image}" th:alt="${product.name}" fetchpriority="high" decoding="async"/></div>
      <div>
        <p class="eyebrow" th:text="${product.brand}">Brand</p>
        <h1 th:text="${product.name}">Name</h1>
        <p class="pd-short" th:text="${product.shortText}">short</p>
        <p class="pd-desc" th:text="${product.description}">desc</p>
        <div class="tags">
          <span class="tag" th:each="a : ${product.applicationsList}" th:text="${a}">app</span>
        </div>
        <a th:if="${'partners'.equals(product.rangeId) and product.link != null and !product.link.isBlank()}"
           th:href="${product.link}" target="_blank" rel="noopener" class="btn btn-primary btn-mt">Visit Website →</a>
      </div>
    </div>
  </div>
</section>

<section class="section-pb-5">
  <div class="container">
    <div class="grid grid-2">
      <div class="spec-card">
        <h2>Key Features</h2>
        <ul>
          <li th:each="f : ${product.featuresList}" th:text="${f}">feat</li>
        </ul>
      </div>
      <div class="spec-card">
        <h2>Technical Specs</h2>
        <div th:if="${not #lists.isEmpty(product.specsList)}" class="spec-table">
          <th:block th:each="s : ${product.specsList}">
            <div class="lbl" th:text="${s.label}">label</div>
            <div class="val" th:text="${s.value}">value</div>
          </th:block>
        </div>
        <p th:if="${#lists.isEmpty(product.specsList)}" class="pd-nospec">Contact us for detailed specifications tailored to your project.</p>
        <a href="/contact" class="btn btn-primary btn-mt">Contact Us</a>
      </div>
    </div>
    <div class="mt-2">
      <a href="/products" class="text-navy-bold">← Back to products</a>
    </div>
  </div>
</section>

</main>
<div th:replace="~{fragments/layout :: ticker-home}"></div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
