<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chi tiết sản phẩm | OMEAX</title>
<meta name="description" content="OMEAX – Your partner for mechanical and electrical equipment."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>

</head>
<body th:with="active='product-detail'">
<div th:replace="~{fragments/header :: header}"></div>
<main>

<section class="crumb">
  <div class="container">
    <a href="/">Home</a><span class="sep">/</span>
    <a href="/products">Sản phẩm</a><span class="sep">/</span>
    <span style="color:#152352;font-weight:600" th:text="${product.name}">Product</span>
  </div>
</section>

<section style="padding:3rem 0">
  <div class="container">
    <div class="detail-hero">
      <div class="img-box">
        <img th:src="${product.image}" th:alt="${product.name}"/>
      </div>
      <div>
        <p class="eyebrow" th:text="${range.brand}">Brand</p>
        <h1 th:text="${product.name}">Name</h1>
        <p style="margin-top:1rem;font-size:1.1rem;color:#334155" 
           th:text="${product.shortText}">short</p>
        <p style="margin-top:1rem;color:#475569;line-height:1.7" 
           th:text="${product.description}">desc</p>
        <div class="tags">
          <span class="tag" 
                th:each="a : ${product.applicationsList}" 
                th:text="${a}">app</span>
        </div>
        <a th:if="${product.link != null and product.link != ''}" 
           th:href="${product.link}" 
           target="_blank" rel="noopener" 
           class="btn btn-primary" 
           style="margin-top:1.5rem">Truy cập website hãng →</a>
      </div>
    </div>
  </div>
</section>

<section style="padding:0 0 5rem">
  <div class="container">
    <div class="grid grid-2">
      <div class="spec-card">
        <h2>Tính năng nổi bật</h2>
        <ul>
          <li th:each="f : ${product.featuresList}" th:text="${f}">feat</li>
        </ul>
        <p th:if="${#lists.isEmpty(product.featuresList)}" 
           style="color:#64748b;font-size:.875rem">Liên hệ để được tư vấn.</p>
      </div>
      <div class="spec-card">
        <h2>Thông số kỹ thuật</h2>
        <div th:if="${not #lists.isEmpty(product.specsList)}" class="spec-table">
          <th:block th:each="s : ${product.specsList}">
            <div class="lbl" th:text="${s.label}">label</div>
            <div class="val" th:text="${s.value}">value</div>
          </th:block>
        </div>
        <p th:if="${#lists.isEmpty(product.specsList)}" 
           style="color:#64748b;font-size:.875rem">Liên hệ để được tư vấn thông số chi tiết.</p>
        <a href="/contact" class="btn btn-primary" style="margin-top:1.5rem">Yêu cầu báo giá →</a>
      </div>
    </div>
    <div style="margin-top:2rem">
      <a href="/products" style="color:#1e3a8a;font-weight:600">← Quay lại danh mục sản phẩm</a>
    </div>
  </div>
</section>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: carousel-js}"></div>
</body></html>
