<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/layout :: head('500 – Server Error | OMEAX')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main id="main">
  <section class="error-section">
    <div class="container">
      <div class="error-code">500</div>
      <h1 class="error-title">Something Went Wrong</h1>
      <p class="error-desc">
        We're having trouble processing your request right now.
        Please try again in a moment. If the problem continues, contact us directly.
      </p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">← Back to Home</a>
        <a class="btn btn-outline" href="/contact">Contact Support</a>
      </div>
    </div>
  </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
