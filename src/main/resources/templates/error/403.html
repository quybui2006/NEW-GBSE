<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/layout :: head('403 – Access Denied | OMEAX')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main id="main">
  <section class="error-section">
    <div class="container">
      <div class="error-code">403</div>
      <h1 class="error-title">Access Denied</h1>
      <p class="error-desc">
        This page is only accessible from the company network.
        Please connect to the office network and try again.
      </p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">← Back to Home</a>
        <a class="btn btn-outline" href="/contact">Contact Support</a>
      </div>
    </div>
  </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
