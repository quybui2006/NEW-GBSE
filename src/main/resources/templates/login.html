<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | OMEAX</title>
    <meta name="robots" content="noindex, nofollow"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
      .login-box{max-width:400px}

      /* Pull Bootstrap's defaults onto the brand palette. Presentation only —
         no markup, form, or class changes on this page. */
      body{ --bs-light-rgb: 234, 246, 239; color: var(--color-text); }
      .card{ --bs-card-bg: var(--color-surface); --bs-card-border-color: var(--color-border); }
      h4{ color: var(--color-text); }
      .form-label{ color: var(--color-text); font-weight: 600; }
      .form-control{ border-color: var(--color-border); color: var(--color-text); }
      .form-control:focus{
        border-color: var(--color-primary);
        box-shadow: 0 0 0 .25rem rgba(var(--color-primary-rgb), .18);
      }
      /* .btn-dark is kept as-is in the markup; only its colours are re-pointed. */
      .btn-dark{
        --bs-btn-bg: var(--color-primary);
        --bs-btn-border-color: var(--color-primary);
        --bs-btn-hover-bg: var(--color-primary-hover);
        --bs-btn-hover-border-color: var(--color-primary-hover);
        --bs-btn-active-bg: var(--color-primary-hover);
        --bs-btn-active-border-color: var(--color-primary-hover);
        --bs-btn-disabled-bg: var(--color-primary);
        --bs-btn-disabled-border-color: var(--color-primary);
      }
      .alert-warning{
        --bs-alert-bg: var(--color-warning-surface);
        --bs-alert-border-color: var(--color-warning-border);
        --bs-alert-color: var(--color-warning);
      }
      .alert-danger{
        --bs-alert-bg: var(--color-error-surface);
        --bs-alert-border-color: var(--color-error-border);
        --bs-alert-color: var(--color-error);
      }
      :focus-visible{ outline: 2px solid var(--color-focus); outline-offset: 2px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 login-box">
    <div class="card p-4 shadow-sm">
        <h4 class="text-center mb-4">Admin Login</h4>

        <div th:if="${param.locked}" class="alert alert-warning">
            Too many failed attempts. This account is temporarily locked.
            Please wait 10 minutes before trying again.
        </div>
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password.
        </div>

        <form action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Log in</button>
        </form>
    </div>
</div>

</body>
</html>
