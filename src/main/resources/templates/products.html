<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{fragments/layout :: head('Products | OMEAX')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main>

<section class="page-header">
  <div class="container">
    <p class="eyebrow">Products</p>
    <h1>Product Catalogue</h1>
    <p class="subtitle">OMEAX · GBSE · Partners</p>
  </div>
</section>

<section class="crumb">
  <div class="container">
    <a href="/">Home</a><span class="sep">/</span>
    <span style="color:#152352;font-weight:600" href="/products">Products</span>
  </div>
</section>

<section style="padding:2.5rem 0;background:#fff">
  <div class="container">
    <div class="search-wrap">
      <span class="search-icon"></span>
      <input id="search" type="text" autocomplete="off" placeholder="Search products..."/>
      <div id="suggestions" class="suggestions"></div>
    </div>
  </div>
</section>

<section style="background:#fff;padding:0 0 4rem">
  <div class="container">
    <div class="range-list">
      <div class="range" th:each="r,it : ${ranges}" th:id="|range-${r.id}|">
        <button class="range-header" type="button" onclick="this.parentElement.classList.toggle('open')">
          <span><h3 th:text="${r.brand}">Brand</h3><span class="tagline" th:text="${r.tagline}"></span></span>
          <span class="chevron"></span>
        </button>
        <div class="range-body">
          <div class="product-grid">
            <a class="prod-card" th:each="p : ${r.products}" th:href="@{'/products/' + ${p.id}}" th:data-name="${p.name}" th:data-short="${p.shortText}" th:data-cat="${p.danhMuc}">
              <div class="pimg"><img th:src="${p.image}" th:alt="${p.name}"></div>
              <div class="pbody">
                <h4 th:text="${p.name}">Name</h4>
                <p class="pshort" th:text="${p.shortText}">short</p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

</main>
<script th:inline="javascript">
  const ALL = /*[[${allProducts}]]*/ [];
  const input = document.getElementById('search');
  const sug = document.getElementById('suggestions');

  function searchAll(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [];
    return ALL.filter(p => (p.name + ' ' + p.shortText).toLowerCase().includes(q)).slice(0,6);
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function renderSug(items){
    if(!items.length){ sug.classList.remove('open'); sug.innerHTML=''; return; }
    // All product data is inserted via esc() to prevent stored XSS.
    // Never use template literals with untrusted data directly in innerHTML.
    sug.innerHTML = items.map(p =>
      '<a href="/products/' + p.id + '">'
      + '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '"/>'
      + '<div style="min-width:0;flex:1">'
      + '<div class="name">' + esc(p.name) + '</div>'
      + '<div class="short">' + esc(p.shortText) + '</div>'
      + '</div>'
      + '<span class="brand">' + esc(p.brand) + '</span>'
      + '</a>'
    ).join('');
    sug.classList.add('open');
  }

  function filterCards(q){
    q = (q||'').trim().toLowerCase();
    document.querySelectorAll('.prod-card').forEach(c => {
      const t = (c.dataset.name + ' ' + c.dataset.short).toLowerCase();
      c.style.display = !q || t.includes(q) ? '' : 'none';
    });
  }

  input.addEventListener('input', e => { renderSug(searchAll(e.target.value)); filterCards(e.target.value); });
  input.addEventListener('focus', e => renderSug(searchAll(e.target.value)));
  input.addEventListener('blur', () => setTimeout(()=>sug.classList.remove('open'),150));
</script>
<div th:replace="~{fragments/layout :: ticker-home}"></div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
