<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEAX Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #ffffff;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: #0044ff;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-subtext {
            font-size: 10px;
            font-weight: 600;
            color: #0044ff;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        nav a {
            text-decoration: none;
            color: #0044ff; /* Đồng bộ màu với logo */
            font-weight: 600;
            font-size: 15px;
            margin-left: 30px;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            height: calc(100vh - 80px);
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            /* Tạo nền gradient kết hợp ảnh kỹ thuật chìm bên dưới để tăng độ sâu */
            background: linear-gradient(135deg, rgba(10, 27, 61, 0.95) 0%, rgba(16, 43, 97, 0.9) 100%), 
                        url('https://images.unsplash.com/photo-1581092160607-ee22621dd758?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            color: #ffffff;
            overflow: hidden;
        }

        /* Đưa Tag định vị lên trên và thu nhỏ lại */
        .sub-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #38bdf8; /* Màu xanh sáng làm điểm nhấn */
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* Tiêu đề chính cứng cáp, mạnh mẽ */
        .main-title {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: 1px;
            max-width: 1000px;
            line-height: 1.2;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Dòng mô tả tinh tế */
        .description {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            max-width: 600px;
            margin-bottom: 40px;
        }

        /* CTA BUTTONS */
        .cta-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px; /* Bo góc vừa phải tạo sự hiện đại */
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #0A1B3D;
        }

        .btn-primary:hover {
            background-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .btn-secondary {
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
        }

        .btn-secondary:hover {
            border-color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Responsive di động */
        @media (max-width: 768px) {
            .main-title { font-size: 36px; }
            .description { font-size: 16px; }
            nav { display: none; } /* Ẩn menu trên mobile nếu chưa làm menu responsive */
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-text">ŌMEAX</div>
            <div class="logo-subtext">SIMPLIFIES LIFE</div>
        </div>
        <nav>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">News</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <span class="sub-title">Company Introduction</span>
        <h1 class="main-title">Omeax Joint Stock Company</h1>
        <p class="description">Your partner for mechanical and electrical equipment</p>
        
        <div class="cta-container">
            <a href="#" class="btn btn-primary">Explore Products →</a>
            <a href="#" class="btn btn-secondary">Contact Us</a>
        </div>
    </section>

</body>
</html>
