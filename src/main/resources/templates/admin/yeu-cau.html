<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý yêu cầu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-nav { background: #1a1a2e; }
        .admin-nav a { 
            color: #ccc !important; 
            text-decoration: none !important; 
            padding: 8px 16px; 
            border-radius: 6px; 
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: 500;
        }
        .admin-nav a:hover { 
            background: rgba(255,255,255,0.15) !important; 
            color: #ffffff !important; 
        }
        .admin-nav a.active { 
            background: rgba(255,255,255,0.25) !important; 
            color: #b8b8d0 !important; 
            font-weight: 600;
        }
        .filter-bar { 
            background: #f8f9fa; 
            border-radius: 10px; 
            padding: 16px; 
            margin-bottom: 20px; 
            border: 1px solid #eee;
        }
        input[type="date"] { 
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            padding: 6px 12px; 
            font-size: 14px; 
        }
        input[type="date"]:focus { 
            outline: none; 
            border-color: #1a1a2e; 
            box-shadow: 0 0 0 2px rgba(26,26,46,0.15); 
        }
        .btn-filter { 
            background: #1a1a2e; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            padding: 7px 18px; 
            transition: 0.2s;
        }
        .btn-filter:hover { 
            background: #2d2d44; 
            color: white; 
        }
        .btn-reset { 
            background: transparent; 
            border: 1px solid #aaa; 
            border-radius: 8px; 
            padding: 7px 18px; 
            color: #555; 
            transition: 0.2s;
        }
        .btn-reset:hover { 
            background: #eee; 
        }
        .badge-count { 
            background: #1a1a2e; 
            color: white; 
            border-radius: 20px; 
            padding: 4px 12px; 
            font-size: 13px; 
        }
        
        /* Style cho nút logout dạng form */
        .logout-btn {
            color: #ff6b6b !important;
            cursor: pointer;
            text-decoration: none !important;
            background: none;
            border: none;
            padding: 8px 16px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: inherit;
            font-family: inherit;
        }
        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.2) !important;
            color: #ff4444 !important;
        }
    </style>
</head>
<body>

<!-- Form ẩn chứa CSRF token cho các request bằng JavaScript -->
<form id="csrfForm" style="display: none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>

<nav class="navbar px-3 py-2 admin-nav">
    <span class="navbar-brand fw-bold text-white">Van & Bơm Nước Quy — Admin</span>
    <div class="d-flex flex-wrap gap-1 align-items-center">
        <a href="/admin">Dashboard</a>
        <a href="/admin/san-pham">Sản phẩm</a>
        <a href="/admin/yeu-cau" class="active">Yêu cầu</a>
        <a href="/" target="_blank">Xem web</a>
        
        <!-- ✅ SỬA: Logout - Form POST có CSRF -->
        <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-btn">Đăng xuất</button>
        </form>
    </div>
</nav>

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">
            Danh sách yêu cầu báo giá 
            <span id="countBadge" class="badge-count">0 yêu cầu</span>
        </h5>
        
        <!-- ✅ SỬA: Export Excel bằng Form POST có CSRF -->
        <form id="exportForm" th:action="@{/admin/bao-cao/excel}" method="post" style="display: inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="period" id="exportPeriod" value="all"/>
            <input type="hidden" name="from" id="exportFrom" value=""/>
            <input type="hidden" name="to" id="exportTo" value=""/>
            <button type="submit" class="btn btn-success btn-sm">Xuất Excel</button>
        </form>
    </div>

    <!-- Bộ lọc lịch -->
    <div class="filter-bar">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-auto">
                <label class="form-label small text-muted mb-1">Từ ngày</label>
                <input type="date" id="fromDate" min="2026-01-01" max="2099-12-31">
            </div>
            <div class="col-12 col-md-auto">
                <label class="form-label small text-muted mb-1">Đến ngày</label>
                <input type="date" id="toDate" min="2026-01-01" max="2099-12-31">
            </div>
            <div class="col-12 col-md-auto d-flex gap-2">
                <button class="btn-filter" onclick="applyFilter()">Lọc</button>
                <button class="btn-reset" onclick="resetFilter()">Xóa lọc</button>
            </div>
        </div>
        <div class="mt-2 d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('today')">Hôm nay</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('week')">Tuần này</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('month')">Tháng này</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('year')">Năm nay</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('all')">Tất cả</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover" id="yeuCauTable">
            <thead class="table-dark">
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>SĐT</th>
                    <th>Email</th>
                    <th>Sản phẩm quan tâm</th>
                    <th>Nội dung</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr th:each="yc, stat : ${danhSachYeuCau}"
                    th:data-time="${yc.thoiGian}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${yc.hoTen}"></td>
                    <td th:text="${yc.soDienThoai}"></td>
                    <td th:text="${yc.email}"></td>
                    <td th:text="${yc.sanPhamQuanTam}"></td>
                    <td th:text="${yc.noiDung}"></td>
                    <td th:text="${yc.thoiGian}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" id="emptyMsg" style="display:none;">Không có yêu cầu nào trong khoảng thời gian này!</p>
    <p class="text-muted" th:if="${#lists.isEmpty(danhSachYeuCau)}">Chưa có yêu cầu nào!</p>
</div>

<script>
// ✅ Hàm lấy CSRF token từ form ẩn
function getCsrfParam() {
    const csrfInput = document.querySelector('#csrfForm input');
    return {
        name: csrfInput.name,
        value: csrfInput.value
    };
}

function getToday() {
    return new Date().toISOString().split('T')[0];
}

function setQuick(type) {
    const today = new Date();
    let from, to = getToday();
    if (type === 'today') {
        from = to;
    } else if (type === 'week') {
        const d = new Date(today);
        d.setDate(today.getDate() - today.getDay());
        from = d.toISOString().split('T')[0];
    } else if (type === 'month') {
        from = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
    } else if (type === 'year') {
        from = `${today.getFullYear()}-01-01`;
    } else {
        from = '';
        to = '';
    }
    document.getElementById('fromDate').value = from;
    document.getElementById('toDate').value = to;
    applyFilter();
}

function applyFilter() {
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    const rows = document.querySelectorAll('#tableBody tr');
    let count = 0;

    rows.forEach(row => {
        const timeStr = row.getAttribute('data-time');
        if (!timeStr) { row.style.display = ''; count++; return; }
        const rowDate = timeStr.substring(0, 10);
        let show = true;
        if (from && rowDate < from) show = false;
        if (to && rowDate > to) show = false;
        row.style.display = show ? '' : 'none';
        if (show) count++;
    });

    document.getElementById('countBadge').textContent = count + ' yêu cầu';
    document.getElementById('emptyMsg').style.display = count === 0 ? 'block' : 'none';

    // ✅ Cập nhật export form với filter hiện tại
    if (from && to) {
        document.getElementById('exportPeriod').value = 'custom';
        document.getElementById('exportFrom').value = from;
        document.getElementById('exportTo').value = to;
    } else {
        document.getElementById('exportPeriod').value = 'all';
        document.getElementById('exportFrom').value = '';
        document.getElementById('exportTo').value = '';
    }
}

function resetFilter() {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    applyFilter();
}

window.onload = function() {
    const rows = document.querySelectorAll('#tableBody tr');
    document.getElementById('countBadge').textContent = rows.length + ' yêu cầu';
};
</script>

</body>
</html>
