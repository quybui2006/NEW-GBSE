<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Requests | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">OMEAX Admin</div>
        <nav class="sidebar-nav">
            <a href="/admin" class="sidebar-link">Dashboard</a>
            <a href="/admin/san-pham" class="sidebar-link">Products</a>
            <a href="/admin/yeu-cau" class="sidebar-link active">Requests</a>
            <a href="/" class="sidebar-link" target="_blank">View site ↗</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="sidebar-logout">Log out</button>
            </form>
        </div>
    </aside>

    <!-- Mobile header -->
    <header class="admin-mobile-header">
        <span class="brand">OMEAX Admin</span>
        <button class="toggle-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">&#9776;</button>
    </header>

    <!-- Mobile offcanvas -->
    <div class="offcanvas offcanvas-start admin-offcanvas" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <span class="text-white fw-bold fs-6">ADMIN</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="offcanvas-nav">
                <a href="/admin">Dashboard</a>
                <a href="/admin/san-pham">Products</a>
                <a href="/admin/yeu-cau" class="active">Requests</a>
                <a href="/">View site</a>
            </nav>
            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="sidebar-logout">Log out</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <main class="admin-main">

        <!-- Page title -->
        <h5 class="page-title mb-3">
            Quote Requests
            <span class="badge-count" th:text="${totalItems} + ' total'">0 total</span>
        </h5>

        <!-- Filter + actions toolbar -->
        <div class="filter-bar">
            <div class="row g-2 align-items-end">
                <div class="col-12 col-md-auto">
                    <label>From</label>
                    <input type="date" id="fromDate">
                </div>
                <div class="col-12 col-md-auto">
                    <label>To</label>
                    <input type="date" id="toDate">
                </div>
                <div class="col-12 col-md-auto d-flex gap-2 align-items-end flex-wrap">
                    <button class="btn-filter" onclick="applyFilter()">Filter</button>
                    <button class="btn-reset"  onclick="resetFilter()">Clear</button>
                    <button class="btn-today"  onclick="setToday()">Today</button>
                    <form th:action="@{/admin/bao-cao/excel}" method="post" style="margin:0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="period" th:value="${(from != null and !from.isEmpty()) ? 'custom' : 'all'}"/>
                        <input type="hidden" name="from" th:value="${from}"/>
                        <input type="hidden" name="to"   th:value="${to}"/>
                        <button type="submit" class="btn-export">Export Excel</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${totalItems == 0}" class="text-center py-5" style="color: var(--muted);">
            No requests found
            <th:block th:if="${from != null and !from.isEmpty()}"> for the selected date range</th:block>.
        </div>

        <!-- Table -->
        <div th:if="${totalItems > 0}">
            <div class="table-responsive">
                <table class="table table-bordered admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Full Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Admin Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="yc, stat : ${danhSachYeuCau}">
                            <td th:text="${currentPage * 20 + stat.index + 1}"></td>
                            <td th:text="${yc.hoTen}"></td>
                            <td class="nowrap-cell" th:text="${yc.soDienThoai}"></td>
                            <td th:text="${yc.email}"></td>
                            <td class="msg-cell" th:text="${yc.noiDung}"></td>
                            <td class="date-cell" th:text="${#temporals.format(yc.thoiGian, 'dd/MM/yyyy HH:mm')}"></td>

                            <!--
                                STATUS cell: the per-row form lives here.
                                Hidden inputs carry adminNote + filter state so the
                                redirect lands back on the same filtered page.
                                The checkbox auto-submits on change via submitRow().
                                Before the note is saved, JS copies the textarea
                                value into note-hidden-{id} then submits this form.
                            -->
                            <td class="status-cell">
                                <form th:id="${'form-' + yc.id}"
                                      th:action="@{/admin/yeu-cau/{id}/cap-nhat(id=${yc.id})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="page" th:value="${currentPage}"/>
                                    <input type="hidden" name="from" th:value="${from}"/>
                                    <input type="hidden" name="to"   th:value="${to}"/>
                                    <input type="hidden"
                                           th:id="${'note-hidden-' + yc.id}"
                                           name="adminNote"
                                           th:value="${yc.adminNote}"/>
                                    <label class="status-toggle">
                                        <input type="checkbox"
                                               name="contacted"
                                               value="true"
                                               th:checked="${yc.contacted}"
                                               th:attr="onchange='submitRow(' + ${yc.id} + ')'"/>
                                        <span th:class="${yc.contacted ? 'status-badge contacted' : 'status-badge pending'}"
                                              th:text="${yc.contacted ? 'Contacted' : 'Not Contacted'}"></span>
                                    </label>
                                </form>
                            </td>

                            <!--
                                ADMIN NOTE cell: inline editing.
                                Default: plain text + pencil icon (visible on row hover).
                                Edit mode (startEdit): hides text+pencil, shows textarea.
                                Enter (without Shift): copies textarea into hidden input → submits form.
                                Escape: cancels edit, restores display.
                            -->
                            <td class="note-cell">
                                <span th:id="${'note-display-' + yc.id}"
                                      class="note-display"
                                      th:classappend="${(yc.adminNote == null or #strings.isEmpty(yc.adminNote)) ? ' note-empty' : ''}"
                                      th:text="${yc.adminNote}"></span>
                                <button type="button"
                                        th:id="${'btn-edit-' + yc.id}"
                                        class="btn-edit-note"
                                        title="Edit note"
                                        th:attr="onclick='startEdit(' + ${yc.id} + ')'">✏</button>
                                <textarea th:id="${'note-textarea-' + yc.id}"
                                          class="note-input"
                                          maxlength="1000"
                                          rows="2"
                                          th:text="${yc.adminNote}"
                                          th:attr="onkeydown='handleNoteKey(event,' + ${yc.id} + ')'"></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
                <span class="page-info"
                      th:text="'Page ' + ${currentPage + 1} + ' of ' + ${totalPages} + ' — ' + ${totalItems} + ' records'">
                </span>
                <div class="d-flex gap-2">
                    <a th:if="${currentPage > 0}"
                       th:href="@{/admin/yeu-cau(page=${currentPage - 1}, from=${from}, to=${to})}"
                       class="btn btn-sm btn-outline-secondary">← Prev</a>
                    <span th:if="${currentPage == 0}"
                          class="btn btn-sm btn-outline-secondary disabled">← Prev</span>

                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/admin/yeu-cau(page=${currentPage + 1}, from=${from}, to=${to})}"
                       class="btn btn-sm btn-outline-secondary">Next →</a>
                    <span th:if="${currentPage >= totalPages - 1}"
                          class="btn btn-sm btn-outline-secondary disabled">Next →</span>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ── Filter bar ─────────────────────────────────────────────────────────── */
function applyFilter() {
    const from = document.getElementById('fromDate').value;
    const to   = document.getElementById('toDate').value;
    if (!from && !to) return;
    window.location.href = `/admin/yeu-cau?from=${from}&to=${to}`;
}

function resetFilter() {
    window.location.href = '/admin/yeu-cau';
}

function setToday() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('fromDate').value = today;
    document.getElementById('toDate').value   = today;
    applyFilter();
}

window.onload = function () {
    const p = new URLSearchParams(window.location.search);
    if (p.has('from')) document.getElementById('fromDate').value = p.get('from');
    if (p.has('to'))   document.getElementById('toDate').value   = p.get('to');
};

/* ── Inline row editing ─────────────────────────────────────────────────── */
function submitRow(id) {
    document.getElementById('form-' + id).submit();
}

function startEdit(id) {
    document.getElementById('note-display-' + id).style.display = 'none';
    document.getElementById('btn-edit-' + id).style.display = 'none';
    const ta = document.getElementById('note-textarea-' + id);
    ta.classList.add('active');
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
}

function handleNoteKey(e, id) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('note-hidden-' + id).value =
            document.getElementById('note-textarea-' + id).value;
        document.getElementById('form-' + id).submit();
    }
    if (e.key === 'Escape') {
        cancelEdit(id);
    }
}

function cancelEdit(id) {
    document.getElementById('note-display-' + id).style.display = '';
    document.getElementById('btn-edit-' + id).style.display = '';
    document.getElementById('note-textarea-' + id).classList.remove('active');
}
</script>
</body>
</html>
