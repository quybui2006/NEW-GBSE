<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý yêu cầu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-nav { background: #1a1a2e; }
        .admin-nav a { color: #ccc; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .admin-nav a:hover, .admin-nav a.active { background: #ffffff20; color: white; }
    </style>
</head>
<body>

<nav class="navbar px-3 py-2 admin-nav">
    <span class="navbar-brand fw-bold text-white">Van & Bơm Nước Quy — Admin</span>
    <div class="d-flex flex-wrap gap-1">
        <a href="/admin">Dashboard</a>
        <a href="/admin/san-pham">Sản phẩm</a>
        <a href="/admin/yeu-cau" class="active">Yêu cầu</a>
        <a href="/" target="_blank">Xem web</a>
        <a href="/logout" style="color:#ff6b6b;">Đăng xuất</a>
    </div>
</nav>

<div class="container-fluid p-4">
    <h5 class="mb-4">Danh sách yêu cầu báo giá</h5>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Họ tên</th>
                    <th>SĐT</th>
                    <th>Email</th>
                    <th>Sản phẩm quan tâm</th>
                    <th>Nội dung</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="yc : ${danhSachYeuCau}">
                    <td th:text="${yc.hoTen}"></td>
                    <td th:text="${yc.soDienThoai}"></td>
                    <td th:text="${yc.email}"></td>
                    <td th:text="${yc.sanPhamQuanTam}"></td>
                    <td th:text="${yc.noiDung}"></td>
                    <td th:text="${yc.thoiGian}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(danhSachYeuCau)}">Chưa có yêu cầu nào!</p>
</div>

</body>
</html>
