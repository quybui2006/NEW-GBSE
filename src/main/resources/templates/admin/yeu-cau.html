<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Requests | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<nav class="navbar px-3 py-2 admin-nav">
    <span class="navbar-brand fw-bold text-white">OMEAX Admin</span>
    <div class="d-flex flex-wrap gap-1 align-items-center">
        <a href="/admin">Dashboard</a>
        <a href="/admin/san-pham">Products</a>
        <a href="/admin/yeu-cau" class="active">Requests</a>
        <a href="/" target="_blank">View site</a>
        <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-btn">Log out</button>
        </form>
    </div>
</nav>

<div class="container-fluid p-4">

    <!-- Header row -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">
            Quote Requests
            <span class="badge-count" th:text="${totalItems} + ' total'">0 total</span>
        </h5>

        <!-- Excel export — reflects the active server-side filter -->
        <form th:action="@{/admin/bao-cao/excel}" method="post" style="display: inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="period" th:value="${(from != null and !from.isEmpty()) ? 'custom' : 'all'}"/>
            <input type="hidden" name="from"   th:value="${from}"/>
            <input type="hidden" name="to"     th:value="${to}"/>
            <button type="submit" class="btn btn-success btn-sm">Export Excel</button>
        </form>
    </div>

    <!-- Filter form — GET request, always resets to page 0 -->
    <div class="filter-bar">
        <form method="get" action="/admin/yeu-cau" id="filterForm">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-auto">
                    <label class="form-label small text-muted mb-1">From</label>
                    <input type="date" name="from" id="fromDate" th:value="${from}">
                </div>
                <div class="col-12 col-md-auto">
                    <label class="form-label small text-muted mb-1">To</label>
                    <input type="date" name="to" id="toDate" th:value="${to}">
                </div>
                <div class="col-12 col-md-auto d-flex gap-2">
                    <button type="submit" class="btn-filter">Filter</button>
                    <a href="/admin/yeu-cau" class="btn-reset">Clear</a>
                </div>
            </div>
        </form>
        <div class="mt-2 d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('today')">Today</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('week')">This week</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('month')">This month</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setQuick('year')">This year</button>
        </div>
    </div>

    <!-- Table -->
    <div th:if="${totalItems == 0}" class="text-muted text-center py-4">
        No requests found
        <th:block th:if="${from != null and !from.isEmpty()}">
            for the selected date range
        </th:block>.
    </div>

    <div th:if="${totalItems > 0}">
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Full Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Product Interest</th>
                        <th>Message</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="yc, stat : ${danhSachYeuCau}">
                        <td th:text="${currentPage * 20 + stat.index + 1}"></td>
                        <td th:text="${yc.hoTen}"></td>
                        <td th:text="${yc.soDienThoai}"></td>
                        <td th:text="${yc.email}"></td>
                        <td th:text="${yc.sanPhamQuanTam}"></td>
                        <td th:text="${yc.noiDung}"></td>
                        <td th:text="${yc.thoiGian}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination controls -->
        <div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
            <span class="page-info"
                  th:text="'Page ' + ${currentPage + 1} + ' of ' + ${totalPages} + ' — ' + ${totalItems} + ' records'">
            </span>
            <div class="d-flex gap-2">
                <a th:if="${currentPage > 0}"
                   th:href="@{/admin/yeu-cau(page=${currentPage - 1}, from=${from}, to=${to})}"
                   class="btn btn-sm btn-outline-secondary">← Prev</a>
                <span th:if="${currentPage == 0}"
                      class="btn btn-sm btn-outline-secondary disabled">← Prev</span>

                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/admin/yeu-cau(page=${currentPage + 1}, from=${from}, to=${to})}"
                   class="btn btn-sm btn-outline-secondary">Next →</a>
                <span th:if="${currentPage >= totalPages - 1}"
                      class="btn btn-sm btn-outline-secondary disabled">Next →</span>
            </div>
        </div>
    </div>

</div>

<script>
// Quick-date buttons populate the filter inputs and submit the server-side filter form.
function setQuick(type) {
    const today = new Date();
    const pad   = n => String(n).padStart(2, '0');
    const fmt   = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    let from = '', to = fmt(today);

    if (type === 'today') {
        from = to;
    } else if (type === 'week') {
        const d = new Date(today);
        d.setDate(today.getDate() - today.getDay());
        from = fmt(d);
    } else if (type === 'month') {
        from = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-01`;
    } else if (type === 'year') {
        from = `${today.getFullYear()}-01-01`;
    }

    document.getElementById('fromDate').value = from;
    document.getElementById('toDate').value   = to;
    document.getElementById('filterForm').submit();
}
</script>

</body>
</html>
