<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<!-- Form ẩn chứa CSRF token cho các request bằng JavaScript -->
<form id="csrfForm" style="display: none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>

<nav class="navbar px-3 py-2 admin-nav sticky-top shadow">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold text-white">OMEAX Admin</span>

        <!-- Desktop Menu -->
        <div class="d-none d-lg-flex flex-wrap gap-1 align-items-center">
            <a href="/admin" class="active">Dashboard</a>
            <a href="/admin/san-pham">Products</a>
            <a href="/admin/yeu-cau">Requests</a>
            <a href="/" target="_blank">View site</a>

            <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-link">Log out</button>
            </form>
        </div>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Mobile Offcanvas Menu -->
        <div class="offcanvas offcanvas-end admin-offcanvas d-lg-none" tabindex="-1" id="adminMenu">
            <div class="offcanvas-header text-white">
                <h5 class="offcanvas-title fw-bold">ADMIN</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-0">
                <div class="navbar-nav">
                    <a href="/admin" class="nav-link active">Dashboard</a>
                    <a href="/admin/san-pham" class="nav-link">Products</a>
                    <a href="/admin/yeu-cau" class="nav-link">Requests</a>
                    <a href="/" class="nav-link text-info">View site</a>

                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="nav-link text-danger w-100 text-start"
                                style="background: none; border: none; cursor: pointer; font-size: inherit;">
                            Log out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid p-4">
    <h5 class="mb-4 fw-bold">System Overview</h5>

    <!-- Filter Bar -->
    <div class="filter-bar shadow-sm">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-auto">
                <label class="form-label small text-muted mb-1">From</label>
                <input type="date" id="fromDate" class="form-control">
            </div>
            <div class="col-12 col-md-auto">
                <label class="form-label small text-muted mb-1">To</label>
                <input type="date" id="toDate" class="form-control">
            </div>
            <div class="col-12 col-md-auto d-flex gap-2">
                <button class="btn-filter" onclick="applyFilter()">Filter</button>
                <button class="btn-reset" onclick="resetFilter()">Clear</button>
                <button class="btn-today" onclick="setToday()">Today</button>
            </div>
        </div>
    </div>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="stat-card shadow-sm text-center">
                <div class="small mb-1" style="color:#aaa;">Total Products</div>
                <div class="fs-1 fw-bold" th:text="${tongSanPham}">0</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card shadow-sm text-center">
                <div class="small mb-1" style="color:#aaa;">Quote Requests</div>
                <div th:if="${hasData}" class="fs-1 fw-bold" th:text="${tongYeuCau}">0</div>
                <div th:unless="${hasData}" class="no-data-message">No data</div>
            </div>
        </div>
    </div>

    <!-- Chart: Requests per day -->
    <div class="row g-4">
        <div class="col-12">
            <div class="chart-box shadow-sm">
                <h6 class="fw-bold mb-3">Quote Requests (last 7 days)</h6>
                <div th:if="${hasData}">
                    <canvas id="requestChart" style="max-height: 300px;"></canvas>
                </div>
                <div th:unless="${hasData}" class="no-data-message text-center">
                    No data for this period
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const chartLabels = /*[[${chartLabels}]]*/ [];
    const chartRequestData = /*[[${chartRequestData}]]*/ [];
    const hasData = /*[[${hasData}]]*/ false;

    if (hasData) {
        new Chart(document.getElementById('requestChart'), {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [{
                    data: chartRequestData,
                    backgroundColor: '#4e4e6a',
                    borderRadius: 4,
                    maxBarThickness: 50
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 800, easing: 'easeInOutQuart' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1a1a2e',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        cornerRadius: 8,
                        padding: 12,
                        displayColors: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f0f0f0' },
                        ticks: { font: { size: 12 }, stepSize: 1 }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 11 } }
                    }
                }
            }
        });
    }

    function setToday() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fromDate').value = today;
        document.getElementById('toDate').value = today;
        applyFilter();
    }

    function applyFilter() {
        const from = document.getElementById('fromDate').value;
        const to   = document.getElementById('toDate').value;
        if (!from && !to) return;
        window.location.href = `/admin?from=${from}&to=${to}`;
    }

    function resetFilter() {
        window.location.href = `/admin`;
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('from')) document.getElementById('fromDate').value = params.get('from');
        if (params.has('to')) document.getElementById('toDate').value = params.get('to');
    };
    /*]]>*/
</script>

</body>
</html>
