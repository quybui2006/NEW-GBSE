<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">OMEAX Admin</div>
        <nav class="sidebar-nav">
            <a href="/admin" class="sidebar-link active">Dashboard</a>
            <a href="/admin/san-pham" class="sidebar-link">Products</a>
            <a href="/admin/yeu-cau" class="sidebar-link">Requests</a>
            <a href="/" class="sidebar-link" target="_blank">View site ↗</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="sidebar-logout">Log out</button>
            </form>
        </div>
    </aside>

    <!-- Mobile header -->
    <header class="admin-mobile-header">
        <span class="brand">OMEAX Admin</span>
        <button class="toggle-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">&#9776;</button>
    </header>

    <!-- Mobile offcanvas -->
    <div class="offcanvas offcanvas-start admin-offcanvas" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <span class="text-white fw-bold fs-6">ADMIN</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="offcanvas-nav">
                <a href="/admin" class="active">Dashboard</a>
                <a href="/admin/san-pham">Products</a>
                <a href="/admin/yeu-cau">Requests</a>
                <a href="/">View site</a>
            </nav>
            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="sidebar-logout">Log out</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <main class="admin-main">
        <h5 class="page-title">System Overview</h5>

        <!-- Stat Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-label">Total Products</div>
                    <div class="stat-value" th:text="${tongSanPham}">0</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-label">Quote Requests</div>
                    <div th:if="${hasData}" class="stat-value" th:text="${tongYeuCau}">0</div>
                    <div th:unless="${hasData}" class="no-data-message">No data</div>
                </div>
            </div>
        </div>

        <!-- Chart -->
        <div class="chart-box">
            <div class="chart-title">Quote Requests — Last 7 Days</div>
            <div th:if="${hasData}">
                <canvas id="requestChart" class="chart-canvas"></canvas>
            </div>
            <div th:unless="${hasData}" class="no-data-message text-center py-3">
                No requests in the last 7 days
            </div>
        </div>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
const chartLabels = /*[[${chartLabels}]]*/ [];
const chartRequestData = /*[[${chartRequestData}]]*/ [];
const hasData = /*[[${hasData}]]*/ false;

if (hasData) {
    new Chart(document.getElementById('requestChart'), {
        type: 'bar',
        data: {
            labels: chartLabels,
            datasets: [{
                data: chartRequestData,
                backgroundColor: '#283A82',
                borderRadius: 4,
                maxBarThickness: 50
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#283A82',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                    cornerRadius: 8,
                    padding: 12,
                    displayColors: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: '#dce4ff' },
                    ticks: { font: { size: 12 }, stepSize: 1 }
                },
                x: {
                    grid: { display: false },
                    ticks: { font: { size: 11 } }
                }
            }
        }
    });
}
/*]]>*/
</script>
</body>
</html>
