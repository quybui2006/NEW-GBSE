<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #1a1a2e; }
        .sidebar a { color: #ccc; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover, .sidebar a.active { background: #ffffff20; color: white; }
        .sidebar .brand { color: white; font-weight: bold; padding: 20px; font-size: 16px; border-bottom: 1px solid #ffffff20; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar" style="width:240px; min-width:240px;">
        <div class="brand">Van & Bơm Nước Quy</div>
        <a href="/admin" class="active">Dashboard</a>
        <a href="/admin/san-pham">Quản lý sản phẩm</a>
        <a href="/admin/yeu-cau">Yêu cầu khách hàng</a>
        <a href="/" target="_blank">Xem trang web</a>
        <a href="/logout" style="color:#ff6b6b;">Đăng xuất</a>
    </div>

    <div class="flex-grow-1 p-4">
        <h4 class="mb-4">Dashboard</h4>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card border-0 p-3" style="background:#2d2d44;">
                    <div class="small mb-1" style="color:#aaa;">Tổng sản phẩm</div>
                    <div class="fs-2 fw-bold" style="color:white;" th:text="${tongSanPham}">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 p-3" style="background:#2d2d44;">
                    <div class="small mb-1" style="color:#aaa;">Yêu cầu báo giá</div>
                    <div class="fs-2 fw-bold" style="color:white;" th:text="${tongYeuCau}">0</div>
                </div>
            </div>
        </div>

        <h6 class="mb-3">Yêu cầu mới nhất</h6>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Họ tên</th>
                    <th>SĐT</th>
                    <th>Sản phẩm quan tâm</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="yc : ${yeuCauMoi}">
                    <td th:text="${yc.hoTen}"></td>
                    <td th:text="${yc.soDienThoai}"></td>
                    <td th:text="${yc.sanPhamQuanTam}"></td>
                    <td th:text="${yc.thoiGian}"></td>
                </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${#lists.isEmpty(yeuCauMoi)}">Chưa có yêu cầu nào!</p>
    </div>
</div>
</body>
</html>
