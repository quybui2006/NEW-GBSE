<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-nav { background: #1a1a2e; }
        
        /* --- STYLE MENU ITEMS --- */
        .admin-nav a { 
            color: #ccc !important; 
            text-decoration: none !important;
            padding: 8px 16px; 
            border-radius: 6px; 
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: 500;
        }
        
        /* Khi di chuột: sáng lên */
        .admin-nav a:hover { 
            background: rgba(255, 255, 255, 0.15) !important; 
            color: #ffffff !important; 
        }
        
        /* Khi active: màu chữ nhạt hơn + nền mờ */
        .admin-nav a.active { 
            background: rgba(255, 255, 255, 0.25) !important; 
            color: #b8b8d0 !important; 
            font-weight: 600;
        }

        /* Mobile Offcanvas Style */
        .admin-offcanvas { background-color: #1a1a2e !important; }
        .admin-offcanvas .offcanvas-header {
            border-bottom: 1px solid rgba(255,255,255,0.15) !important;
        }
        .admin-offcanvas .nav-link { 
            color: #ccc !important; 
            padding: 15px 20px; 
            text-decoration: none !important;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .admin-offcanvas .nav-link:hover { 
            background: rgba(255,255,255,0.15); 
            color: #ffffff !important; 
        }
        .admin-offcanvas .nav-link.active {
            background: rgba(255,255,255,0.25) !important;
            color: #b8b8d0 !important;
            font-weight: 600;
        }

        /* Các thành phần nội dung */
        .stat-card { background: #1a1a2e; color: white; border-radius: 12px; padding: 25px; height: 100%; border: none; }
        .filter-bar { background: #f8f9fa; border-radius: 10px; padding: 16px; margin-bottom: 20px; border: 1px solid #eee; }
        input[type="date"] { border: 1px solid #ced4da; border-radius: 8px; padding: 6px 12px; font-size: 14px; }
        
        .btn-filter { background: #1a1a2e; color: white; border: none; border-radius: 8px; padding: 7px 18px; transition: 0.2s; }
        .btn-filter:hover { background: #2d2d44; }
        .btn-today { background: #4e4e6a; color: white; border: none; border-radius: 8px; padding: 7px 18px; transition: 0.2s; }
        .btn-today:hover { background: #3d3d54; }
        .btn-reset { background: transparent; border: 1px solid #aaa; border-radius: 8px; padding: 7px 18px; color: #555; transition: 0.2s; }
        .btn-reset:hover { background: #eee; }
        
        .chart-box { background: white; padding: 20px; border-radius: 12px; border: 1px solid #eee; height: 100%; }
        
        /* Loading state */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<nav class="navbar px-3 py-2 admin-nav sticky-top shadow">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold text-white">Van & Bơm Nước Quy — Admin</span>
        
        <div class="d-none d-lg-flex flex-wrap gap-1">
            <a href="/admin" class="active">Dashboard</a>
            <a href="/admin/san-pham">Sản phẩm</a>
            <a href="/admin/yeu-cau">Yêu cầu</a>
            <a href="/" target="_blank">Xem web</a>
            <a href="/logout" style="color:#ff6b6b !important;">Đăng xuất</a>
        </div>

        <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-end admin-offcanvas d-lg-none" tabindex="-1" id="adminMenu">
            <div class="offcanvas-header text-white">
                <h5 class="offcanvas-title fw-bold">QUẢN TRỊ</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-0">
                <div class="navbar-nav">
                    <a href="/admin" class="nav-link active">Dashboard</a>
                    <a href="/admin/san-pham" class="nav-link">Sản phẩm</a>
                    <a href="/admin/yeu-cau" class="nav-link">Yêu cầu</a>
                    <a href="/" class="nav-link text-info">Xem web</a>
                    <a href="/logout" class="nav-link text-danger">Đăng xuất</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid p-4">
    <h5 class="mb-4 fw-bold">Tổng quan hệ thống</h5>

    <div class="filter-bar shadow-sm">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-auto">
                <label class="form-label small text-muted mb-1">Từ ngày</label>
                <input type="date" id="fromDate" class="form-control">
            </div>
            <div class="col-12 col-md-auto">
                <label class="form-label small text-muted mb-1">Đến ngày</label>
                <input type="date" id="toDate" class="form-control">
            </div>
            <div class="col-12 col-md-auto d-flex gap-2">
                <button class="btn-filter" onclick="applyFilter()">Lọc</button>               
                <button class="btn-reset" onclick="resetFilter()">Xóa lọc</button>
                <button class="btn-today" onclick="setToday()">Hôm nay</button>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card shadow-sm text-center">
                <div class="small mb-1" style="color:#aaa;">Tổng sản phẩm</div>
                <div class="fs-1 fw-bold" th:text="${tongSanPham}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card shadow-sm text-center">
                <div class="small mb-1" style="color:#aaa;">Yêu cầu báo giá</div>
                <div class="fs-1 fw-bold" th:text="${tongYeuCau}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card shadow-sm text-center">
                <div class="small mb-1" style="color:#aaa;">Tổng lượt truy cập</div>
                <div class="fs-1 fw-bold" th:text="${luotTruyCap}">0</div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="chart-box shadow-sm position-relative">
                <h6 class="fw-bold mb-3">Lượt truy cập</h6>
                <canvas id="accessChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-box shadow-sm position-relative">
                <h6 class="fw-bold mb-3">Số lượt yêu cầu báo giá</h6>
                <canvas id="requestChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    // Dữ liệu từ controller
    const chartLabels = /*[[${chartLabels}]]*/ [];
    const chartAccessData = /*[[${chartAccessData}]]*/ [];
    const chartRequestData = /*[[${chartRequestData}]]*/ [];
    
    console.log('Chart Labels:', chartLabels);
    console.log('Access Data:', chartAccessData);
    console.log('Request Data:', chartRequestData);

    // Cấu hình chung cho biểu đồ
    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
            duration: 800,
            easing: 'easeInOutQuart'
        },
        plugins: { 
            legend: { display: false },
            tooltip: {
                backgroundColor: '#1a1a2e',
                titleColor: '#fff',
                bodyColor: '#fff',
                cornerRadius: 8,
                padding: 12,
                displayColors: false
            }
        },
        scales: {
            y: { 
                beginAtZero: true, 
                grid: { color: '#f0f0f0' },
                ticks: { 
                    font: { size: 12 },
                    stepSize: 1
                }
            },
            x: { 
                grid: { display: false },
                ticks: { font: { size: 11 } }
            }
        }
    };

    // Kiểm tra và render biểu đồ nếu có dữ liệu
    function renderCharts() {
        if (chartLabels && chartLabels.length > 0 && chartAccessData && chartRequestData) {
            // Biểu đồ lượt truy cập
            new Chart(document.getElementById('accessChart'), {
                type: 'bar',
                data: { 
                    labels: chartLabels, 
                    datasets: [{ 
                        label: 'Lượt truy cập',
                        data: chartAccessData, 
                        backgroundColor: '#1a1a2e', 
                        borderRadius: 6,
                        hoverBackgroundColor: '#2d2d44',
                        maxBarThickness: 50
                    }] 
                },
                options: commonOptions
            });

            // Biểu đồ yêu cầu báo giá
            new Chart(document.getElementById('requestChart'), {
                type: 'bar',
                data: { 
                    labels: chartLabels, 
                    datasets: [{ 
                        label: 'Yêu cầu',
                        data: chartRequestData, 
                        backgroundColor: '#4e4e6a', 
                        borderRadius: 6,
                        hoverBackgroundColor: '#6b6b8a',
                        maxBarThickness: 50
                    }] 
                },
                options: commonOptions
            });
        } else {
            console.warn('No chart data available');
            // Hiển thị thông báo không có dữ liệu
            document.querySelectorAll('canvas').forEach(canvas => {
                const ctx = canvas.getContext('2d');
                ctx.font = '16px Arial';
                ctx.fillStyle = '#999';
                ctx.textAlign = 'center';
                ctx.fillText('Không có dữ liệu trong khoảng thời gian này', canvas.width/2, canvas.height/2);
            });
        }
    }

    // Hàm xử lý filter
    function setToday() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fromDate').value = today;
        document.getElementById('toDate').value = today;
        applyFilter();
    }

    function applyFilter() {
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        
        if (!from && !to) {
            alert('Vui lòng chọn ít nhất một ngày!');
            return;
        }
        
        // Luôn gửi cả 2 tham số để backend xử lý
        let url = '/admin?';
        if (from) url += `from=${from}&`;
        if (to) url += `to=${to}`;
        
        window.location.href = url;
    }

    function resetFilter() {
        window.location.href = '/admin';
    }

    // Khởi tạo
    window.onload = function() {
        // Điền ngày từ URL parameters
        const params = new URLSearchParams(window.location.search);
        if (params.has('from')) document.getElementById('fromDate').value = params.get('from');
        if (params.has('to')) document.getElementById('toDate').value = params.get('to');
        
        // Render biểu đồ
        renderCharts();
    };
    /*]]>*/
</script>

</body>
</html>
