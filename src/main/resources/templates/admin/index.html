<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-nav { background: #1a1a2e; }
        .admin-nav a { color: #ccc; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .admin-nav a:hover, .admin-nav a.active { background: #ffffff20; color: white; }
        .stat-card { background: #1a1a2e; color: white; border-radius: 12px; padding: 20px; }
        .period-btn.active { background: #1a1a2e; color: white; }
    </style>
</head>
<body>

<nav class="navbar px-3 py-2 admin-nav">
    <span class="navbar-brand fw-bold text-white">Van & Bơm Nước Quy — Admin</span>
    <div class="d-flex flex-wrap gap-1">
        <a href="/admin" class="active">Dashboard</a>
        <a href="/admin/san-pham">Sản phẩm</a>
        <a href="/admin/yeu-cau">Yêu cầu</a>
        <a href="/" target="_blank">Xem web</a>
        <a href="/logout" style="color:#ff6b6b;">Đăng xuất</a>
    </div>
</nav>

<div class="container-fluid p-4">
    <h5 class="mb-4">Dashboard</h5>

    <!-- Bộ lọc thời gian -->
    <div class="mb-4">
        <div class="btn-group" id="periodGroup">
            <button class="btn btn-outline-dark btn-sm period-btn active" onclick="setPeriod('day', this)">Hôm nay</button>
            <button class="btn btn-outline-dark btn-sm period-btn" onclick="setPeriod('week', this)">Tuần này</button>
            <button class="btn btn-outline-dark btn-sm period-btn" onclick="setPeriod('month', this)">Tháng này</button>
            <button class="btn btn-outline-dark btn-sm period-btn" onclick="setPeriod('year', this)">Năm nay</button>
            <button class="btn btn-outline-dark btn-sm period-btn" onclick="setPeriod('all', this)">Tất cả</button>
        </div>
    </div>

    <!-- Thống kê -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="small mb-1" style="color:#aaa;">Tổng sản phẩm</div>
                <div class="fs-2 fw-bold" th:text="${tongSanPham}">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="small mb-1" style="color:#aaa;">Yêu cầu báo giá</div>
                <div class="fs-2 fw-bold" id="soYeuCau" th:text="${tongYeuCau}">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="small mb-1" style="color:#aaa;">Lượt truy cập</div>
                <div class="fs-2 fw-bold" id="luotTruyCap" th:text="${luotTruyCap}">0</div>
            </div>
        </div>
    </div>

    <!-- Xuất báo cáo -->
    <div class="mb-4 d-flex gap-2 align-items-center">
        <span class="text-muted small">Xuất báo cáo:</span>
        <a id="exportBtn" href="/admin/bao-cao/excel?period=day" class="btn btn-success btn-sm">
            Xuất Excel
        </a>
    </div>

    <!-- Bảng yêu cầu -->
    <h6 class="mb-3">Yêu cầu mới nhất</h6>
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Họ tên</th>
                    <th>SĐT</th>
                    <th>Sản phẩm quan tâm</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="yc : ${yeuCauMoi}">
                    <td th:text="${yc.hoTen}"></td>
                    <td th:text="${yc.soDienThoai}"></td>
                    <td th:text="${yc.sanPhamQuanTam}"></td>
                    <td th:text="${yc.thoiGian}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(yeuCauMoi)}">Chưa có yêu cầu nào!</p>
</div>

<script>
let currentPeriod = 'day';

function setPeriod(period, btn) {
    currentPeriod = period;
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('exportBtn').href = '/admin/bao-cao/excel?period=' + period;
}
</script>

</body>
</html>
