<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-nav { background: #1a1a2e; }
        .admin-nav a { color: #ccc; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .admin-nav a:hover, .admin-nav a.active { background: #ffffff20; color: white; }
    </style>
</head>
<body>

<nav class="navbar px-3 py-2 admin-nav">
    <span class="navbar-brand fw-bold text-white">Van & Bơm Nước Quy — Admin</span>
    <div class="d-flex flex-wrap gap-1">
        <a href="/admin">Dashboard</a>
        <a href="/admin/san-pham" class="active">Sản phẩm</a>
        <a href="/admin/yeu-cau">Yêu cầu</a>
        <a href="/" target="_blank">Xem web</a>
        <a href="/logout" style="color:#ff6b6b;">Đăng xuất</a>
    </div>
</nav>

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5>Quản lý sản phẩm</h5>
        <a href="/admin/san-pham/them" class="btn btn-dark">+ Thêm sản phẩm</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Giá</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sp : ${danhSach}">
                    <td th:text="${sp.ten}"></td>
                    <td th:text="${sp.danhMuc}"></td>
                    <td th:text="${sp.gia}"></td>
                    <td>
                        <a th:href="@{/admin/san-pham/sua/{id}(id=${sp.id})}" class="btn btn-sm btn-warning">Sửa</a>
                        <a th:href="@{/admin/san-pham/xoa/{id}(id=${sp.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Xác nhận xóa?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(danhSach)}">Chưa có sản phẩm nào!</p>
</div>

</body>
</html>
