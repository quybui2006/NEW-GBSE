<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-nav { background: #1a1a2e; }
        .admin-nav a { 
            color: #ccc !important; 
            text-decoration: none !important; 
            padding: 8px 16px; 
            border-radius: 6px; 
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: 500;
        }
        .admin-nav a:hover { 
            background: rgba(255,255,255,0.15) !important; 
            color: #ffffff !important; 
        }
        .admin-nav a.active { 
            background: rgba(255,255,255,0.25) !important; 
            color: #b8b8d0 !important; 
            font-weight: 600;
        }
        
        /* Style cho nút logout */
        .logout-btn {
            color: #ff6b6b !important;
            cursor: pointer;
            text-decoration: none !important;
            background: none;
            border: none;
            padding: 8px 16px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: inherit;
            font-family: inherit;
        }
        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.2) !important;
            color: #ff4444 !important;
        }
    </style>
</head>
<body>

<nav class="navbar px-3 py-2 admin-nav">
    <span class="navbar-brand fw-bold text-white">OMEAX Admin</span>
    <div class="d-flex flex-wrap gap-1 align-items-center">
        <a href="/admin">Dashboard</a>
        <a href="/admin/san-pham" class="active">Products</a>
        <a href="/admin/yeu-cau">Requests</a>
        <a href="/" target="_blank">View site</a>

        <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-btn">Log out</button>
        </form>
    </div>
</nav>

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5>Manage Products</h5>
        <a href="/admin/san-pham/them" class="btn btn-dark">+ Add Product</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sp : ${danhSach}">
                    <td th:text="${sp.ten}"></td>
                    <td th:text="${sp.danhMuc}"></td>
                    <td th:text="${sp.gia}"></td>
                    <td>
                        <a th:href="@{/admin/san-pham/sua/{id}(id=${sp.id})}"
                           class="btn btn-sm btn-warning">Edit</a>

                        <form th:action="@{/admin/san-pham/xoa/{id}(id=${sp.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Confirm delete?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(danhSach)}">No products yet.</p>
</div>

</body>
</html>
