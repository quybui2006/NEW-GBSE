<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #1a1a2e; }
        .sidebar a { color: #ccc; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover, .sidebar a.active { background: #ffffff20; color: white; }
        .sidebar .brand { color: white; font-weight: bold; padding: 20px; font-size: 16px; border-bottom: 1px solid #ffffff20; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar" style="width:240px; min-width:240px;">
        <div class="brand">Van & Bơm Nước Quy</div>
        <a href="/admin">Dashboard</a>
        <a href="/admin/san-pham" class="active">Quản lý sản phẩm</a>
        <a href="/admin/yeu-cau">Yêu cầu khách hàng</a>
        <a href="/" target="_blank">Xem trang web</a>
        <a href="/logout" style="color:#ff6b6b;">Đăng xuất</a>
    </div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>Quản lý sản phẩm</h4>
            <a href="/admin/san-pham/them" class="btn btn-dark">+ Thêm sản phẩm</a>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Giá</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sp : ${danhSach}">
                    <td th:text="${sp.ten}"></td>
                    <td th:text="${sp.danhMuc}"></td>
                    <td th:text="${sp.gia}"></td>
                    <td>
                        <a th:href="@{/admin/san-pham/sua/{id}(id=${sp.id})}" class="btn btn-sm btn-warning">Sửa</a>
                        <a th:href="@{/admin/san-pham/xoa/{id}(id=${sp.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Xác nhận xóa?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${#lists.isEmpty(danhSach)}">Chưa có sản phẩm nào!</p>
    </div>
</div>
</body>
</html>
