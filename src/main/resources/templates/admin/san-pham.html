<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">OMEAX Admin</div>
        <nav class="sidebar-nav">
            <a href="/admin" class="sidebar-link">Dashboard</a>
            <a href="/admin/san-pham" class="sidebar-link active">Products</a>
            <a href="/admin/yeu-cau" class="sidebar-link">Requests</a>
            <a href="/" class="sidebar-link" target="_blank">View site ↗</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="sidebar-logout">Log out</button>
            </form>
        </div>
    </aside>

    <!-- Mobile header -->
    <header class="admin-mobile-header">
        <span class="brand">OMEAX Admin</span>
        <button class="toggle-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">&#9776;</button>
    </header>

    <!-- Mobile offcanvas -->
    <div class="offcanvas offcanvas-start admin-offcanvas" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <span class="text-white fw-bold fs-6">ADMIN</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="offcanvas-nav">
                <a href="/admin">Dashboard</a>
                <a href="/admin/san-pham" class="active">Products</a>
                <a href="/admin/yeu-cau">Requests</a>
                <a href="/">View site</a>
            </nav>
            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="sidebar-logout">Log out</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <main class="admin-main">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="page-title mb-0">Products</h5>
            <a href="/admin/san-pham/them" class="btn btn-sm btn-primary">+ Add Product</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered admin-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sp : ${danhSach}">
                        <td th:text="${sp.ten}"></td>
                        <td th:text="${sp.danhMuc}"></td>
                        <td th:text="${sp.gia}"></td>
                        <td>
                            <a th:href="@{/admin/san-pham/sua/{id}(id=${sp.id})}"
                               class="btn btn-sm btn-warning">Edit</a>
                            <form th:action="@{/admin/san-pham/xoa/{id}(id=${sp.id})}"
                                  method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Confirm delete?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="page-info" th:if="${#lists.isEmpty(danhSach)}">No products yet.</p>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
