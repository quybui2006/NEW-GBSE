<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Product Form | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold">OMEAX Admin</span>
        <div class="d-flex align-items-center gap-3">
            <a href="/admin/san-pham" class="text-white text-decoration-none">Products</a>
            <a href="/admin/yeu-cau" class="text-white text-decoration-none">Requests</a>

            <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-link text-white p-0 text-decoration-none"
                    style="font-size: inherit;">Log out</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 600px;">
        <h2 class="mb-4" th:text="${sp.id == null} ? 'Add Product' : 'Edit Product'"></h2>

        <form th:action="@{/admin/san-pham/luu}" method="post" th:object="${sp}" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />
            <!-- Preserve existing image path on edit -->
            <input type="hidden" th:field="*{hinhAnh}" />

            <div class="mb-3">
                <label class="form-label">Product Name *</label>
                <input type="text" th:field="*{ten}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Range / Brand Group</label>
                <select th:field="*{rangeId}" class="form-select">
                    <option value="">— select —</option>
                    <option value="omeax">OMEAX — Bơm & Van công nghiệp</option>
                    <option value="gbse">GBSE — Van cân bằng · Heatpump · Đo lường</option>
                    <option value="partners">Partners — Hệ thống ứng dụng</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select th:field="*{danhMuc}" class="form-select">
                    <option value="pumps">Pumps</option>
                    <option value="valves">Valves</option>
                    <option value="heatpump">Heatpump</option>
                    <option value="measure">Measurement</option>
                    <option value="phe">Plate Heat Exchanger</option>
                    <option value="hvac">HVAC System</option>
                    <option value="hot">Hot Water Supply</option>
                    <option value="indus">Industrial Water</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Brand</label>
                <input type="text" th:field="*{brand}" class="form-control" placeholder="Grundfos / OMEAX / Ocean...">
            </div>

            <div class="mb-3">
                <label class="form-label">Short description</label>
                <input type="text" th:field="*{shortText}" class="form-control"
                    placeholder="Smart pressurization system for high-rise buildings.">
            </div>

            <div class="mb-3">
                <label class="form-label">Brand website URL</label>
                <input type="text" th:field="*{link}" class="form-control" placeholder="https://www.grundfos.com/vn">
            </div>

            <div class="mb-3">
                <label class="form-label">Applications
                    <small class="text-muted">(JSON array, e.g. ["HVAC","Fire Protection"])</small>
                </label>
                <input type="text" th:field="*{applications}" class="form-control"
                    placeholder='["HVAC","Plumbing","Fire Protection"]'>
            </div>

            <div class="mb-3">
                <label class="form-label">Key Features
                    <small class="text-muted">(JSON array)</small>
                </label>
                <textarea th:field="*{features}" class="form-control" rows="3"
                    placeholder='["Max pressure 16 bar","Cast iron body","UL/FM certified"]'></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Technical Specs
                    <small class="text-muted">(JSON array of {label, value})</small>
                </label>
                <textarea th:field="*{specs}" class="form-control" rows="4"
                    placeholder='[{"label":"DN","value":"50–200"},{"label":"PN","value":"16"}]'></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{moTa}" class="form-control" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Price (leave empty if negotiable)</label>
                <input type="number" th:field="*{gia}" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Image</label>
                <input type="file" name="hinhAnhFile" class="form-control" accept="image/*">
                <img th:if="${sp.hinhAnh != null and sp.hinhAnh != ''}"
                    th:src="${sp.image}"
                    class="mt-2 img-thumbnail" style="max-width:200px;">
            </div>

            <button type="submit" class="btn btn-dark w-100">Save</button>
            <a href="/admin/san-pham" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>

</body>

</html>
