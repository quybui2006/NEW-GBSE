<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${sp.id != null} ? 'Edit Product | OMEAX Admin' : 'Add Product | OMEAX Admin'">Product Form | OMEAX Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">OMEAX Admin</div>
        <nav class="sidebar-nav">
            <a href="/admin" class="sidebar-link">Dashboard</a>
            <a href="/admin/san-pham" class="sidebar-link active">Products</a>
            <a href="/admin/yeu-cau" class="sidebar-link">Requests</a>
            <a href="/" class="sidebar-link" target="_blank">View site ↗</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="sidebar-logout">Log out</button>
            </form>
        </div>
    </aside>

    <!-- Mobile header -->
    <header class="admin-mobile-header">
        <span class="brand">OMEAX Admin</span>
        <button class="toggle-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">&#9776;</button>
    </header>

    <!-- Mobile offcanvas -->
    <div class="offcanvas offcanvas-start admin-offcanvas" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <span class="text-white fw-bold fs-6">ADMIN</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="offcanvas-nav">
                <a href="/admin">Dashboard</a>
                <a href="/admin/san-pham" class="active">Products</a>
                <a href="/admin/yeu-cau">Requests</a>
                <a href="/">View site</a>
            </nav>
            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="sidebar-logout">Log out</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <main class="admin-main">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="page-title mb-0" th:text="${sp.id != null} ? 'Edit Product' : 'Add Product'">Product Form</h5>
            <a href="/admin/san-pham" class="btn btn-sm btn-secondary">← Back</a>
        </div>

        <div th:if="${saveError}" class="alert alert-danger" th:text="${saveError}"></div>

        <form th:action="@{/admin/san-pham/luu}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="id" th:value="${sp.id}"/>
            <input type="hidden" name="hinhAnh" th:value="${sp.hinhAnh}"/>

            <div class="row g-3">
                <!-- Product Name -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Product Name *</label>
                    <input type="text" name="ten" class="form-control" th:value="${sp.ten}" required/>
                </div>

                <!-- Short Text -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Short Description</label>
                    <input type="text" name="shortText" class="form-control" th:value="${sp.shortText}"/>
                </div>

                <!-- Full Description -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Full Description</label>
                    <textarea name="moTa" class="form-control" rows="3" th:text="${sp.moTa}"></textarea>
                </div>

                <!-- Category & Brand -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Category</label>
                    <input type="text" name="danhMuc" class="form-control" th:value="${sp.danhMuc}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Brand</label>
                    <input type="text" name="brand" class="form-control" th:value="${sp.brand}"/>
                </div>

                <!-- Range ID & Link -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Range ID</label>
                    <input type="text" name="rangeId" class="form-control" th:value="${sp.rangeId}"
                           placeholder="e.g. omeax, gbse, partners"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">External Link (Partners)</label>
                    <input type="text" name="link" class="form-control" th:value="${sp.link}"/>
                </div>

                <!-- Image -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Product Image</label>
                    <div th:if="${sp.hinhAnh != null and !sp.hinhAnh.isEmpty()}" class="mb-2">
                        <img th:src="${sp.image}" alt="Current image" style="max-height:120px; border-radius:4px;"/>
                        <div class="text-muted small mt-1">Current image — upload a new file to replace</div>
                    </div>
                    <input type="file" name="hinhAnhFile" class="form-control" accept="image/*"/>
                </div>

                <!-- Features -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Features</label>
                    <div class="text-muted small mb-1">One feature per line</div>
                    <textarea name="featuresRaw" class="form-control" rows="5" th:text="${featuresLines}"></textarea>
                </div>

                <!-- Applications -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Applications</label>
                    <div class="text-muted small mb-1">One application per line</div>
                    <textarea name="applicationsRaw" class="form-control" rows="5" th:text="${applicationsLines}"></textarea>
                </div>

                <!-- Specs -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Specifications</label>
                    <div class="text-muted small mb-1">One spec per line in format: <code>Label: Value</code></div>
                    <textarea name="specsRaw" class="form-control" rows="8" th:text="${specsLines}"></textarea>
                </div>

                <!-- Submit -->
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <a href="/admin/san-pham" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
