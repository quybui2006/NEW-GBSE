<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm - Van & Bơm Nước</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">Van & Bơm Nước Quy</span>
    <div>
        <a href="/" class="text-white me-3">Trang chủ</a>
        <a href="/san-pham" class="text-white me-3">Sản phẩm</a>
        <a href="/lien-he" class="text-white">Liên hệ</a>
    </div>
</nav>
<div class="bg-light py-3">
    <div class="container">
        <form action="/san-pham" method="get" class="d-flex gap-2" style="max-width:500px;">
            <input type="text" name="keyword" class="form-control"
                   placeholder="Tìm kiếm sản phẩm..."
                   th:value="${keyword}">
            <button type="submit" class="btn btn-dark">Tìm</button>
            <a th:if="${keyword}" href="/san-pham" class="btn btn-outline-secondary">Xóa</a>
        </form>
    </div>
</div>

<!-- Nội dung -->
<div class="container mt-4">
    <h2 class="mb-4">Danh sách sản phẩm</h2>

    <!-- ĐÃ THAY PHẦN ROW Ở ĐÂY -->
    <div class="row row-cols-1 row-cols-md-4 g-4">
        <div class="col" th:each="sp : ${danhSach}">
            <div class="card h-100">

                <img th:if="${sp.hinhAnh != null and sp.hinhAnh != ''}"
                     th:src="@{/uploads/{file}(file=${sp.hinhAnh})}"
                     class="card-img-top"
                     style="aspect-ratio:16/9; object-fit:cover;">

                <img th:if="${sp.hinhAnh == null or sp.hinhAnh == ''}"
                     src="https://placehold.co/400x180?text=Chua+co+anh"
                     class="card-img-top"
                     style="aspect-ratio:16/9; object-fit:cover;">

                <div class="card-body d-flex flex-column">
                    <span class="badge bg-secondary mb-2 align-self-start"
                          th:text="${sp.danhMuc}"></span>

                    <h6 class="card-title" th:text="${sp.ten}"></h6>

                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${sp.moTa}"></p>

                    <a th:href="@{/san-pham/{id}(id=${sp.id})}" 
                       class="btn btn-outline-dark btn-sm mt-2">
                       Xem chi tiết
                    </a>
                </div>

            </div>
        </div>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(danhSach)}">Chưa có sản phẩm nào!</p>
</div>

</body>
</html>
