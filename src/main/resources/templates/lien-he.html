<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Van & Bơm Nước Quy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS để tạo dấu sao đỏ */
        .required-label::after {
            content: " *";
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">Van & Bơm Nước Quy</span>
    <div>
        <a href="/" class="text-white me-2">Trang chủ</a>
        <a href="/san-pham" class="text-white me-2">Sản phẩm</a>
        <a href="/lien-he" class="text-white">Liên hệ</a>
    </div>
</nav>

<div class="container mt-4 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h4 class="mb-4">Yêu cầu báo giá</h4>

            <div th:if="${thanhCong}" class="alert alert-success">
                Cảm ơn bạn! Chúng tôi sẽ liên hệ sớm nhất có thể.
            </div>

            <form action="/lien-he" method="post">
                <div class="mb-3">
                    <label class="form-label required-label">Họ tên</label>
                    <input type="text" name="hoTen" class="form-control" placeholder="Nhập họ và tên" required>
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">Số điện thoại</label>
                    <input type="tel" name="soDienThoai" class="form-control" placeholder="Nhập số điện thoại" required>
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@vi-du.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label required-label">Sản phẩm quan tâm</label>
                    <input type="text" name="sanPhamQuanTam" class="form-control" placeholder="Ví dụ: Van bi DN25, Bơm ly tâm..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nội dung yêu cầu (Ghi chú)</label>
                    <textarea name="noiDung" class="form-control" rows="4" placeholder="Nhập thêm chi tiết nếu có..."></textarea>
                </div>

                <button type="submit" class="btn btn-dark w-100">Gửi yêu cầu</button>
            </form>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <small>© 2026 Van & Bơm Nước Quy. All rights reserved.</small>
</footer>

</body>
</html>
