<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ - Van & Bơm Nước Quy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">Van & Bơm Nước Quy</span>
    <div>
        <a href="/" class="text-white me-3">Trang chủ</a>
        <a href="/san-pham" class="text-white me-3">Sản phẩm</a>
        <a href="/lien-he" class="text-white">Liên hệ</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4">Yêu cầu báo giá</h2>

    <!-- Thông báo gửi thành công -->
    <div th:if="${thanhCong}" class="alert alert-success">
        Cảm ơn bạn! Chúng tôi sẽ liên hệ sớm nhất có thể.
    </div>

    <form action="/lien-he" method="post">
        <div class="mb-3">
            <label class="form-label">Họ tên *</label>
            <input type="text" name="hoTen" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Số điện thoại *</label>
            <input type="text" name="soDienThoai" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Sản phẩm quan tâm</label>
            <input type="text" name="sanPhamQuanTam" class="form-control" placeholder="Ví dụ: Van bi DN25, Bơm ly tâm...">
        </div>
        <div class="mb-3">
            <label class="form-label">Nội dung yêu cầu</label>
            <textarea name="noiDung" class="form-control" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-dark w-100">Gửi yêu cầu</button>
    </form>
</div>

</body>
</html>
