<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van & Bơm Nước Quy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero { background-color: #1a1a2e; color: white; padding: 60px 20px; }
        
        /* Hiệu ứng: Mục được chọn sẽ nhạt màu đi */
        @media (min-width: 992px) {
            .nav-desktop-link {
                text-decoration: none !important;
                transition: opacity 0.2s ease, border-bottom 0.2s ease;
                border-bottom: 2px solid transparent;
                padding-bottom: 4px;
            }
            .nav-desktop-link:hover {
                opacity: 0.6; /* Nhạt màu đi khi đưa chuột vào */
                border-bottom: 2px solid rgba(255,255,255,0.6); /* Gạch chân cũng nhạt theo */
            }
        }

        .nav-link-mobile { font-weight: 500; color: #1a1a2e !important; text-transform: uppercase; padding: 15px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 sticky-top shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">Van & Bơm Nước Quy</a>
        
        <div class="d-none d-lg-flex">
            <a href="/" class="text-white me-4 nav-desktop-link">Trang chủ</a>
            <a href="/san-pham" class="text-white me-4 nav-desktop-link">Sản phẩm</a>
            <a href="/lien-he" class="text-white nav-desktop-link">Liên hệ</a>
        </div>

        <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#userMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-end d-lg-none" tabindex="-1" id="userMenu">
            <div class="offcanvas-header border-bottom">
                <h5 class="offcanvas-title fw-bold text-dark">DANH MỤC</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav text-center">
                    <li><a class="nav-link nav-link-mobile" href="/">Trang chủ</a></li>
                    <li><a class="nav-link nav-link-mobile" href="/san-pham">Sản phẩm</a></li>
                    <li><a class="nav-link nav-link-mobile" href="/lien-he" >Liên hệ</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="hero text-center">
    <div class="container">
        <h1 class="display-5 fw-bold">Van & Bơm Nước Chất Lượng Cao</h1>
        <p class="lead mt-3">Chuyên cung cấp van công nghiệp, bơm nước các loại.</p>
        <a href="/san-pham" class="btn btn-light btn-lg mt-3 me-2 shadow-sm">Xem sản phẩm</a>
        <a href="/lien-he" class="btn btn-outline-light btn-lg mt-3">Liên hệ ngay</a>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <small>© 2026 Van & Bơm Nước Quy. All rights reserved.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
